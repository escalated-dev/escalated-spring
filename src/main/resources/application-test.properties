# The suite runs on H2 unless the environment says otherwise, so running it
# locally needs nothing installed. CI runs it three times -- h2, postgres and
# mysql -- because the three disagree about enough to matter: identifier length
# limits, LIKE case sensitivity, what may carry a column default, and how
# aggregates come back. A suite that has only ever seen H2 has tested none of it,
# and H2 is the one database no host deploys on.
#
# ESCALATED_TEST_URL is the only value that has to be set; the rest follow it.
spring.datasource.url=${ESCALATED_TEST_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${ESCALATED_TEST_DRIVER_CLASS:org.h2.Driver}
spring.datasource.username=${ESCALATED_TEST_USERNAME:sa}
spring.datasource.password=${ESCALATED_TEST_PASSWORD:}

# Hibernate builds the schema here rather than Flyway, so the suite is not also
# a migration test. Unset the platform and Hibernate detects it from the
# connection, which is what the server-backed legs want.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=${ESCALATED_TEST_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.flyway.enabled=false
escalated.enabled=true
