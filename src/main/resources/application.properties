# Escalated Spring defaults
escalated.enabled=true
escalated.route-prefix=escalated
escalated.knowledge-base.enabled=false
escalated.broadcasting.enabled=false
escalated.two-factor.enabled=false
escalated.sla.check-interval-seconds=60
escalated.snooze.check-interval-seconds=60
escalated.webhook.max-retries=3
escalated.widget.enabled=true
escalated.guest-access.enabled=false
escalated.newsletters.enabled=false
escalated.newsletters.app-url=http://localhost
escalated.newsletters.default-theme=default
escalated.newsletters.rate-limit-per-minute=60
escalated.newsletters.batch-size=50
escalated.newsletters.tracking-enabled=true
