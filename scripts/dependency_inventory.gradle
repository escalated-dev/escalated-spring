import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

gradle.projectsEvaluated {
    rootProject.tasks.register("dependencyInventory") {
        doLast {
            def rows = []
            def configurations = rootProject.configurations.findAll {
                it.name in ["runtimeClasspath", "testRuntimeClasspath", "annotationProcessor", "checkstyle"]
            }
            configurations.add(rootProject.buildscript.configurations.classpath)
            configurations.each { configuration ->
                configuration.incoming.resolutionResult.allComponents.each { component ->
                    def id = component.id
                    if (id instanceof ModuleComponentIdentifier) {
                        rows.add([configuration: configuration.name, name: id.group + ":" + id.module, version: id.version])
                    }
                }
            }
            new File(System.getProperty("dependency.inventory.output")).text = JsonOutput.toJson(rows)
        }
    }
}
