name: Publish

# Publishes dev.escalated:escalated-spring to Maven Central (Central Portal)
# when a GitHub release is published. Re-run for an existing tag with
# "Run workflow" (workflow_dispatch) and the tag name. See RELEASE.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.2.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  maven-central:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      # A tag cut before the Maven Central config landed (v0.2.1) has no
      # signing/bundle setup. Borrow build.gradle.kts from the commit this
      # workflow runs on, but only when nothing else differs from the tag --
      # i.e. the build script is the sole change -- so the published code is
      # exactly the tagged code.
      - name: Check publishing configuration
        run: |
          if grep -q 'centralBundle' build.gradle.kts; then
            echo "$TAG has the Maven Central publishing config."
            exit 0
          fi
          if git diff --quiet "$TAG" "$GITHUB_SHA" -- . ':!build.gradle.kts' ':!.github' ':!RELEASE.md' ':!CHANGELOG.md'; then
            echo "$TAG predates the publishing config; using build.gradle.kts from $GITHUB_SHA (no other source differences)."
            git checkout "$GITHUB_SHA" -- build.gradle.kts
            git diff "$TAG" -- build.gradle.kts
          else
            echo "::error::$TAG predates the Maven Central publishing config and its sources differ from $GITHUB_SHA. Cut a new release from main instead."
            git diff --stat "$TAG" "$GITHUB_SHA" -- . ':!build.gradle.kts' ':!.github' ':!RELEASE.md' ':!CHANGELOG.md'
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify project version matches tag
        run: |
          version="$(./gradlew -q properties --property version | sed -n 's/^version: //p')"
          expected="${TAG#v}"
          echo "Tag: $TAG  Project version: $version"
          if [ "$version" != "$expected" ]; then
            echo "::error::build.gradle.kts has version = \"$version\" but the tag is $TAG (expected $expected). Bump the version and re-tag."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and test
        run: ./gradlew build

      - name: Check secrets
        id: secrets
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          missing=0
          for name in MAVEN_USERNAME MAVEN_PASSWORD MAVEN_GPG_PRIVATE_KEY MAVEN_GPG_PASSPHRASE; do
            if [ -z "${!name}" ]; then
              echo "skipping: $name not configured"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether this version is already on Maven Central
        id: existing
        if: steps.secrets.outputs.publish == 'true'
        run: |
          url="https://repo1.maven.org/maven2/dev/escalated/escalated-spring/$VERSION/escalated-spring-$VERSION.pom"
          if curl -sfI "$url" >/dev/null; then
            echo "skipping: dev.escalated:escalated-spring:$VERSION is already on Maven Central"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed Central bundle
        if: steps.secrets.outputs.publish == 'true' && steps.existing.outputs.published == 'false'
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          ./gradlew centralBundle
          unzip -l build/central-bundle.zip

      - uses: actions/upload-artifact@v7
        if: steps.secrets.outputs.publish == 'true' && steps.existing.outputs.published == 'false'
        with:
          name: central-bundle-${{ env.TAG }}
          path: build/central-bundle.zip

      - name: Upload to the Central Portal
        if: steps.secrets.outputs.publish == 'true' && steps.existing.outputs.published == 'false'
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          set -euo pipefail
          token="$(printf '%s:%s' "$MAVEN_USERNAME" "$MAVEN_PASSWORD" | base64 -w0)"
          api=https://central.sonatype.com/api/v1/publisher
          deployment="$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $token" \
            -F "bundle=@build/central-bundle.zip" \
            "$api/upload?name=escalated-spring-$VERSION&publishingType=AUTOMATIC")"
          echo "Deployment id: $deployment"
          # Validation and publication are asynchronous; wait for a final state.
          for attempt in $(seq 1 60); do
            status="$(curl -sS --fail-with-body -X POST \
              -H "Authorization: Bearer $token" \
              "$api/status?id=$deployment")"
            state="$(echo "$status" | jq -r .deploymentState)"
            echo "[$attempt] $state"
            case "$state" in
              PUBLISHED)
                echo "Published dev.escalated:escalated-spring:$VERSION (Maven Central search can take a while to show it)."
                exit 0 ;;
              FAILED)
                echo "$status" | jq .
                echo "::error::Central Portal rejected the deployment"
                exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::Deployment $deployment did not reach PUBLISHED within 20 minutes; check https://central.sonatype.com/publishing/deployments"
          exit 1
